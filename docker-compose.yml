services:
  # 1. BASE DE DATOS
  postgres_db:
    image: postgres:15-alpine
    container_name: lol_predict_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. BACKEND
  backend:
    build: ./backend
    container_name: lol_predict_backend
    ports:
      - "8000:8000"
    depends_on:
      postgres_db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres_db
    volumes:
      - ./db:/backend/db
      - ./data:/backend/data

  # 3. FRONTEND
  frontend:
    build: ./frontend
    container_name: lol_predict_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
